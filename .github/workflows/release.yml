name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # workflow_dispatch:


permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: CubicleChat-win64
            build_cmd: npm run build:win:all
            artifact_pattern: '*.exe,*.zip'
          - os: ubuntu-latest
            name: Linux
            artifact_name: CubicleChat-linux-x64
            build_cmd: npm run build:linux
            artifact_pattern: '*.AppImage,*.deb,*.rpm,*.tar.gz'
          # - os: macos-latest
          #   name: macOS
          #   artifact_name: CubicleChat-mac
          #   build_cmd: pnpm run electron:build:mac
          #   artifact_pattern: '*.dmg'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache-dependency-path: package-lock.json

      - name: Set version from tag
        run: node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.TAG_VERSION.replace(/^v/,'');fs.writeFileSync('package.json',JSON.stringify(pkg,null,2));console.log('Version:',pkg.version);"
        working-directory: ./
        env:
          TAG_VERSION: ${{ github.ref_name }}

      - name: Install dependencies
        working-directory: ./
        run: npm ci

      - name: Build application
        working-directory: ./
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          # 获取当前标签
          CURRENT_TAG=${{ github.ref_name }}
          # 获取上一个标签（按版本排序）
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$CURRENT_TAG"^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            # 如果没有上一个标签，获取所有提交
            echo "No previous tag found, listing all commits"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            # 获取两个标签之间的提交
            echo "Previous tag: $PREVIOUS_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges "$PREVIOUS_TAG".."$CURRENT_TAG")
          fi

          # 将换行符替换为特殊标记，以便在 GitHub Actions 输出中使用
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ## Installation Packages

            ### Windows
            - Download the `.exe` installer or `.zip` portable version

            ### Linux
            - AppImage: Run directly without installation
            - DEB: For Debian/Ubuntu
            - RPM: For Fedora/RHEL/CentOS

            ### macOS
            - DMG: Mount and drag to Applications
          files: |
            # dist/*.exe
            dist/CubicleChat-*.zip
            dist/cubicle-chat-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ## Installation Packages

            ### Windows
            - Download the `.exe` installer or `.zip` portable version

            ### Linux
            - AppImage: Run directly without installation
            - DEB: For Debian/Ubuntu
            - RPM: For Fedora/RHEL/CentOS

            ### macOS
            - DMG: Mount and drag to Applications
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (macOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ## Installation Packages

            ### Windows
            - Download the `.exe` installer or `.zip` portable version

            ### Linux
            - AppImage: Run directly without installation
            - DEB: For Debian/Ubuntu
            - RPM: For Fedora/RHEL/CentOS

            ### macOS
            - DMG: Mount and drag to Applications
          files: |
            dist/*.dmg
            dist/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/**/*
          retention-days: 7

  release-pr:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: ls -la artifacts/

      - name: Generate release notes
        run: |
          echo "## Installation Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Windows" >> $GITHUB_STEP_SUMMARY
          echo "- Download the `.exe` installer or `.zip` portable version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Linux" >> $GITHUB_STEP_SUMMARY
          echo "- AppImage: Run directly without installation" >> $GITHUB_STEP_SUMMARY
          echo "- DEB: For Debian/Ubuntu" >> $GITHUB_STEP_SUMMARY
          echo "- RPM: For Fedora/RHEL/CentOS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### macOS" >> $GITHUB_STEP_SUMMARY
          echo "- DMG: Mount and drag to Applications" >> $GITHUB_STEP_SUMMARY
